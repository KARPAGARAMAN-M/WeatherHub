# Spring Boot Configuration for WeatherHub
server.port=${PORT:8080}

# OpenWeatherMap API Key (passed via OPENWEATHER_API_KEY or VITE_OPENWEATHER_API_KEY env var)
openweather.api.key=${OPENWEATHER_API_KEY:${VITE_OPENWEATHER_API_KEY:}}
openweather.api.base-url=https://api.openweathermap.org

# Jackson JSON formatting
spring.jackson.serialization.indent-output=true

# Logging
logging.level.com.weatherhub=INFO
