# Spring Boot Configuration for WeatherHub
server.port=8080

# OpenWeatherMap API Key (can be passed via environment variable or system property)
openweather.api.key=${VITE_OPENWEATHER_API_KEY:}
openweather.api.base-url=https://api.openweathermap.org

# Jackson JSON formatting
spring.jackson.serialization.indent-output=true

# Logging
logging.level.com.weatherhub=INFO
