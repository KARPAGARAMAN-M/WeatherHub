version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weatherhub-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-${VITE_OPENWEATHER_API_KEY:-}}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/weather/geocoding?query=London || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - weatherhub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-${VITE_OPENWEATHER_API_KEY:-}}
        VITE_API_BASE_URL: ""
    container_name: weatherhub-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - weatherhub-network

networks:
  weatherhub-network:
    driver: bridge
